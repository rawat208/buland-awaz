<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #F4F2EC;
        font-family: 'Manrope', sans-serif;
        position: relative;
        overflow: hidden;
        border: 16px solid #111111;
      }
      .logo-row { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 24px; }
      .tag {
        position: absolute; top: 72px; right: 72px;
        background: #FFC107; border: 3px solid #111;
        padding: 12px 20px; font-weight: 800; font-size: 20px;
        letter-spacing: 0.25em; text-transform: uppercase; color: #111;
      }
      h1 {
        position: absolute; left: 72px; top: 200px;
        font-family: 'Clash Display', sans-serif; font-weight: 600;
        text-transform: uppercase; line-height: 0.88; letter-spacing: -0.02em;
        font-size: 118px; color: transparent; -webkit-text-stroke: 3px #111;
      }
      h1 span { color: #E33A25; -webkit-text-stroke: 0; display: block; }
      .sub {
        position: absolute; left: 76px; bottom: 96px;
        font-size: 28px; font-weight: 500; color: #111; max-width: 760px; line-height: 1.35;
      }
      .chip {
        position: absolute; right: 72px; bottom: 88px;
        background: #111; color: #F4F2EC; padding: 18px 28px;
        font-weight: 800; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase;
      }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: #E33A25; }
    </style>
  </head>
  <body>
    <div class="logo-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96">
        <rect width="64" height="64" fill="#E33A25"/>
        <path d="M12 27 L38 19 L38 45 L12 37 Z" fill="#F4F2EC"/>
        <path d="M15 39 L19 51 L26 51 L22 40 Z" fill="#F4F2EC"/>
        <path d="M44 26 Q50.5 32 44 38" stroke="#F4F2EC" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M49 21 Q58.5 32 49 43" stroke="#F4F2EC" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <rect x="10" y="19" width="5" height="20" fill="#F4F2EC"/>
      </svg>
      <div style="font-family:'Clash Display',sans-serif;font-weight:600;font-size:34px;text-transform:uppercase;letter-spacing:-0.01em;color:#111;">
        Gurugram · Haryana
      </div>
    </div>
    <div class="tag">Demo Site</div>
    <h1>Buland <span>Awaaz</span></h1>
    <div class="sub">Voice of the unheard — child rights, education, women's dignity.<br />Har bachcha school me, har awaaz buland.</div>
    <div class="chip">Join the movement</div>
    <div class="bar"></div>
  </body>
</html>
